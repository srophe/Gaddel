      <!-- Plausible -->
      <script defer data-domain="d2iy9xuv4su69v.cloudfront.net" src="https://plausible.io/js/script.js"></script>

      <!-- JQuery -->
      <link href="/resources/jquery-ui/jquery-ui.min.css" rel="stylesheet" />
      <script type="text/javascript" src="/resources/js/jquery.min.js"></script>

      <!-- Bootstrap -->
      <script type="text/javascript" src="/resources/bootstrap/js/bootstrap.min.js"></script>

      <style>
        /* ---- Project News archive page styling ----
           Typography kept consistent with site CSS (syriaca.css / style.css):
           base body text ~1em arial, h1 #456889, h2-h4 #666, em-based sizes. */
        .news-page {
          max-width: 860px;      /* comfortable reading measure */
          margin: 0 auto;
          padding: 0 1.25rem;
          font-size: 1em;        /* inherit site base (no shrink) */
        }
        .news-page > h1 {
          color: #456889;        /* matches site h1 */
          font-weight: 500;
          margin-bottom: 0.25em;
        }
        .news-page .news-nav { margin-bottom: 1.5em; }

        .news-item { margin: 0 0 2.5em 0; }
        .news-item > h2 {
          color: #456889;        /* darker than the site's default #666 h2, per review */
          font-weight: 500;
          font-size: 1.5em;      /* same scale as site h2 */
          margin: 0 0 0.15em 0;
          line-height: 1.25;
        }
        .news-item .news-date {
          color: #777;
          margin: 0 0 0.75em 0;
          font-style: italic;
          font-size: 0.95em;
        }

        /* Body content: full-size readable text, consistent with the rest of the site */
        .news-body { font-size: 1em; line-height: 1.6; color: #222; }
        .news-body p { margin: 0 0 1em 0; }
        .news-body h1,
        .news-body h2,
        .news-body h3,
        .news-body h4 {
          color: #456889;
          font-weight: 500;
          margin: 1.2em 0 0.4em 0;
          line-height: 1.3;
        }
        .news-body h1 { font-size: 1.5em; }
        .news-body h2 { font-size: 1.35em; }
        .news-body h3 { font-size: 1.2em; }
        .news-body h4 { font-size: 1.05em; }
        .news-body ul,
        .news-body ol { margin: 0 0 1em 1.5em; }
        .news-body li { margin-bottom: 0.3em; }
        .news-body a { color: #2a6496; }
        .news-body table { margin: 1em 0; width: 100%; border-collapse: collapse; }
        .news-body td, .news-body th { padding: 0.4em 0.6em; border: 1px solid #e0e0e0; }

        /* Images: centered, consistent max size, never overflow the column */
        .news-body img {
          display: block;
          margin: 1.25em auto;
          max-width: 100%;
          max-height: 460px;     /* cap tall flyers/posters so sizes feel consistent */
          width: auto;
          height: auto;
        }
        /* Figures: caption below a centered image, not floated beside it */
        .news-body figure {
          margin: 1.5em auto;
          max-width: 100%;
          text-align: center;
        }
        .news-body figure img { margin: 0 auto 0.5em auto; }
        .news-body figcaption {
          font-size: 0.9em;
          color: #777;
          font-style: italic;
          text-align: center;
          max-width: 520px;
          margin: 0 auto;
          line-height: 1.4;
        }

        .news-item hr,
        .news-page > hr { border: 0; border-top: 1px solid #e0e0e0; margin: 2em 0; }

        /* ---- Collapsible long posts (default collapsed) ---- */
        .news-body.is-collapsible { position: relative; }
        .news-body.is-collapsed {
          max-height: 16em;
          overflow: hidden;
        }
        /* fade-out hint at the bottom while collapsed */
        .news-body.is-collapsed::after {
          content: "";
          position: absolute;
          left: 0; right: 0; bottom: 0;
          height: 4em;
          background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
          pointer-events: none;
        }
        .news-toggle {
          display: inline-block;
          margin: 0.6em 0 0 0;
          padding: 0.25em 0.9em;
          background: #456889;
          color: #fff;
          border: none;
          border-radius: 3px;
          font-size: 0.95em;
          cursor: pointer;
        }
        .news-toggle:hover { background: #37536e; }
      </style>
   </head>
   <body id="body">
      <script src="/resources/js/generic-navbar-search.js"></script>
      <div id="navbar-container"></div>

      <div class="main-content-block">
         <div class="news-page" style="margin-top: 2em; margin-bottom: 3em;">
            <h1>Project News</h1>
            <p class="news-nav"><a href="/index.html">&larr; Back to home</a></p>
            <hr />
            <!-- Full Project News archive, maintained internally in /project-news.json
                 (array of { "title", "date" (YYYY-MM-DD), "content" (HTML) }, newest first).
                 No external blog dependency. -->
            <div id="news-archive">
               <p>Loading project news&hellip;</p>
            </div>
         </div>
      </div>

      <footer>
         <div class="container">
            <a rel="license"><img alt="Creative Commons License" style="border-width:0" src="/resources/images/cc.svg" height="18px" /><img alt="Creative Commons Attribution (CC-BY) License" style="border-width:0" src="/resources/images/by.svg" height="18px" /></a> This work is licensed under a <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0 International License (CC BY 4.0)</a>.<br />Copyright by the contributors. See "<a href="/how-to-cite.html">How to Cite</a>" for attribution information.
         </div>
      </footer>

      <script type="text/javascript" src="/resources/js/require.min.js"></script>
      <script type="text/javascript" src="/resources/js/srophe.js"></script>

      <script>
      document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById('news-archive');
        if (!container) return;

        function formatDate(dateStr) {
          const parts = (dateStr || '').split('-');
          if (parts.length === 3) {
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            if (!isNaN(d)) {
              return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
            }
          }
          return dateStr || '';
        }

        fetch('/project-news.json')
          .then(response => response.json())
          .then(posts => {
            container.innerHTML = '';
            if (!posts.length) {
              container.innerHTML = '<p>No project news available.</p>';
              return;
            }
            const toToggle = [];

            posts.forEach(post => {
              const article = document.createElement('article');
              article.className = 'news-item';

              const h2 = document.createElement('h2');
              // Plain-text title (no links)
              h2.textContent = post.title || '';

              const dateEl = document.createElement('p');
              dateEl.className = 'news-date';
              dateEl.textContent = formatDate(post.date);

              const body = document.createElement('div');
              body.className = 'news-body';
              // content is trusted first-party HTML (own posts; blog links already removed)
              body.innerHTML = post.content || '';

              article.appendChild(h2);
              article.appendChild(dateEl);
              article.appendChild(body);
              article.appendChild(document.createElement('hr'));
              container.appendChild(article);
              toToggle.push({ article, body });
            });

            // After render, collapse long posts by default and add a More/Hide toggle.
            // Short posts (that fit within the collapsed height) stay fully visible,
            // with no button. Measuring after insertion lets images/layout settle.
            const COLLAPSED_PX = 260; // ~16em at base size; matches .is-collapsed max-height
            let collapseDone = false;
            function setupCollapse() {
              if (collapseDone) return; // run once (image-load net + timeout safety)
              collapseDone = true;
              toToggle.forEach(({ article, body }) => {
                if (body.scrollHeight <= COLLAPSED_PX + 24) return; // short enough, leave open
                body.classList.add('is-collapsible', 'is-collapsed');

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'news-toggle';
                btn.setAttribute('aria-expanded', 'false');
                btn.textContent = 'Read more';
                btn.addEventListener('click', function () {
                  const collapsed = body.classList.toggle('is-collapsed');
                  btn.setAttribute('aria-expanded', String(!collapsed));
                  btn.textContent = collapsed ? 'Read more' : 'Show less';
                  if (collapsed) {
                    // keep the post heading in view when collapsing
                    article.scrollIntoView({ block: 'nearest' });
                  }
                });
                // insert the button right after the body, before the <hr>
                body.parentNode.insertBefore(btn, body.nextSibling);
              });
            }

            // Collapse once images have loaded so heights are accurate.
            const imgs = container.querySelectorAll('img');
            if (imgs.length) {
              let left = imgs.length;
              const done = () => { if (--left <= 0) setupCollapse(); };
              imgs.forEach(img => {
                if (img.complete) { done(); }
                else { img.addEventListener('load', done); img.addEventListener('error', done); }
              });
              // safety net in case some load events never fire
              setTimeout(setupCollapse, 1500);
            } else {
              setupCollapse();
            }
          })
          .catch(error => {
            console.error('Error loading project news archive:', error);
            container.innerHTML = '<p>Unable to load project news at this time.</p>';
          });
      });
      </script>
   </body>
</html>
